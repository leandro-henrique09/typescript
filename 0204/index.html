<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0204</title>
    <style>
        body {
            font-size: 1.25rem;
            font-family: sans-serif;
            margin: 2rem;
        }
        .lista-items{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            width: 600px;
        }
        .lista-items li{
            padding: 12px;
            background-color: #efefef;
            list-style: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .preco{
            place-items: start end;
        }
        .teclado {
            grid-column: 1/ 3;
        }
    </style>
</head>
<body> 
    <script src="./script.js"></script>
</body>
</html>
